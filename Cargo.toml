[package]
name = "agctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

# `testing` compiles the test-only seams (fake keychain backend, endpoint URL
# overrides, fault injection). It is never enabled in a release artifact: a
# production-visible token-URL override would be an exfiltration vector, and
# `cfg(debug_assertions)` cannot serve as the gate because this project builds
# with `-C debug-assertions=off` everywhere. See plan section 3.9, AC37, AC38.
[features]
testing = []

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
crossterm = "0.29"
etcetera = "0.11"
hex = "0.4.3"
jiff = "0.2"
libc = "0.2"
open = "5.4.3"
rand = "0.10.2"
ratatui = "0.30"
rustix = { version = "1", features = ["fs", "process"] }
# Named only so a TLS failure inside an `io::Error` can be recognised by type
# (provider/codex/oauth.rs); the same crate `ureq` already links, no new code.
rustls = { version = "0.23.45", default-features = false }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
signal-hook = "0.4"
tabled = "0.22"
thiserror = "2"
toml = { version = "1.1.6", default-features = false, features = ["parse", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1"
# Pinned exactly: provider/codex/oauth.rs classifies every `ureq::Error` a
# refresh POST can end in (decision D-035's class table), and whether a token
# may be re-sent depends on those variants and on where the TLS handshake runs.
# A bump re-verifies that table against the new source before it lands.
ureq = { version = "=3.4.1", features = ["json"] }
url = "2"

[dev-dependencies]
assert_cmd = "2.2.2"
flate2 = "1.1.10"
httpmock = "0.8"
insta = "1"
jsonschema = "0.56"
predicates = "3.1.4"
# AC119's receipt rule parses the source tree (numbered deviation 14). `syn` 3
# is the major serde, clap and thiserror 2 already build, so the tests add no
# third copy; `span-locations` lets a violation name its line.
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
# The Codex refresh client's self-signed TLS test generates its certificate at
# test time, so no key material is committed.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
syn = { version = "3.0.5", default-features = false, features = ["clone-impls", "full", "parsing", "visit"] }
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false

[profile.dev]
panic = "abort"
split-debuginfo = "unpacked"
codegen-units = 128
debug = "line-tables-only"
opt-level = 0
lto = false
incremental = true

# Skip debug info for non-workspace dependencies; workspace crates keep line-tables-only.
[profile.dev.package."*"]
debug = false

[profile.bench]
debug = true
